[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."schedule-upload"]
  timeout = 60

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback so deep links like /tickets/<id> work
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Scheduled: post previous business day's EOD report to GroupMe at 4:30 AM Eastern (8:30 AM UTC)
[functions."eod-scheduled"]
  schedule = "30 8 * * *"

# Scheduled: delete BEO PDFs for events 2+ days old, runs at 4 AM Eastern (8 AM UTC)
[functions."beo-cleanup"]
  schedule = "0 8 * * *"

# Scheduled: overdue ticket alert — Mondays and Thursdays at 8 AM ET (12 PM UTC)
[functions."overdue-alert"]
  schedule = "0 12 * * 1,4"

# Scheduled: weekly summary to admins — Mondays at 7 AM ET (11 AM UTC)
[functions."weekly-summary"]
  schedule = "0 11 * * 1"
